  - Audit whether any choice X=X(n), T=T(n) gives a useful window without assuming zero exclusion or a global S_Lambda polynomial bound.
  - Compare Dunster--Gil--Segura uniform Laguerre asymptotics with the exact arithmetic tail requirements and reject fixed-x Fejer summation without uniform gluing.

