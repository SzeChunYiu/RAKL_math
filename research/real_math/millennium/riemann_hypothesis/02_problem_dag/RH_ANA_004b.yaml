known_boundary:
  - Coffey's S_Lambda is exactly a signed prime-power sum with a Laguerre kernel.
  - Finite Abel summation rewrites it through A(x)=floor(x)-psi(x) and L_{n-1}^{(2)}.
  - For fixed n the global boundary vanishes under a quantitative PNT error.
  - The Laplace transform of L_{n-1}^{(2)} is n+1-s+s(1-1/s)^(n+1).
  - A single zero mode rho therefore produces n/rho+1-(1-1/rho)^(-n); its exponential modulus boundary is Re(rho)=1/2.
  - Coffey's global polynomial-growth target for the oscillatory S_Lambda component is RH-sufficient/root-scale, so it is not accepted as a weaker child contract.
  - Current Johnston--Cully-Hugill arXiv:2402.04272 gives a finite-height explicit formula with an explicit pointwise remainder but no theorem transporting that remainder through this n-dependent Laguerre functional.

