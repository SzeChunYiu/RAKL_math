known_boundary:
  - Suzuki's unconditional G_n in L2 yields a manifestly nonnegative norm but does not by itself transport positivity to lambda_n.
  - The audited Suzuki proof reaches RH-conditional/RH-equivalent model-space structure at the norm-to-Li transport step.
  - This is a source-bounded route diagnostic, not a theorem that no weaker norm bridge can exist.
  - RH-ANA-001 already rejects finite Li-prefix positivity as a global surrogate.
  - Any finite prime truncation, termwise-positive decomposition, or computed prefix is non-authoritative until a rigorous all-n remainder/tail theorem is proved.
  - Exact regularization, sum/interchange order, archimedean terms, binomial weights and cancellation must be preserved.
  - Lagarias' source-bound finite-place decomposition localizes the finite-place term through an incomplete Li coefficient at height about sqrt(n), plus O(sqrt(n) log n).
  - In the same source, RH up to height T yields the corresponding RH-shaped finite-place bound only for n <= T^2/[4(log T)^2]; finite-height evidence therefore has an explicit bounded index window.
  - Voros' positive and gently varying Z(j) coordinates still enter an oscillatory alternating/binomial transform for lambda_n, so source-coordinate positivity is not termwise Li positivity.
  - A density or finite-height hypothesis compatible with one off-critical quartet still leaves an exponentially amplifying Li zero factor; density and zero exclusion remain distinct coordinates.

