known_boundary:
  - Lagarias Theorem 6.1 localizes the finite-place term to an incomplete Li coefficient at height about sqrt(n), up to O(sqrt(n) log n).
  - The corresponding small incomplete-Li estimate in that source is stated under RH and is not an unconditional bridge.
  - A fixed symmetry-compatible off-line quartet changes ordinary zero counting by only O(1) but creates exponential Li radial amplification along a subsequence.
  - Therefore any aggregate count/density premise that permits such a quartet is insufficient by itself.
  - This does not prune weighted density, zero-free, direct prime-cancellation, mollifier/resonance, or global-growth routes that introduce genuinely new information.
  - Any proposed radial/moment bound must be audited for hidden equivalence to pointwise critical-line location before it is treated as a strictly weaker bridge.

