known_boundary:
  - Coffey 0706.0343v2 gives S_2=S_gamma+S_Lambda and proves S_gamma=O(n).
  - Coffey math-ph/0505052v1 gives lambda_n=S_2+S_1+an explicit linear term, with S_1=(n/2)log(n)+O(n).
  - Thus lambda_n-S_Lambda(n)=(n/2)log(n)+O(n) unconditionally.
  - Voros math/0506326v2 gives tempered n log n Li growth under RH and exponentially growing two-sign oscillations if RH is false.
  - Hence any global two-sided polynomial bound on the full S_Lambda is RH-equivalent and is not a strictly weaker child obligation.
  - One-sided or proper localized prime/Laguerre subcomponent bounds remain unclassified.

