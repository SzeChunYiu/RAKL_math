  allowed: false
  reason: >-
    Freeze a fresh MathContextFiber, source-bind the proposed decomposition and
    remainder, retrieve relevant success/failure experience, run the six-role
    same-context expert cell, preserve a hash-chained pre-candidate trace, and
    establish a lemma-strength DifferenceWitness before proposing any estimate.

required_difference_witness:
  local_target_must_not_alone_imply:
    - whole S_Lambda(n)=exp(o(n))
    - lambda_n=exp(o(n))
    - lambda_n>=0 for all n
    - exclusion of every off-critical-line zeta zero
    - the exact RH root
  root_sensitive_remainder: MUST_REMAIN_EXPLICIT

next_pre_candidate_discriminators:
  - Re-express the Laguerre kernel against prime powers / integer background without discarding conditional convergence or cancellation.
  - Identify a source-proved truncation, smoothing, dyadic, Mellin, or explicit-formula split whose local bound is genuinely sub-root.
  - Test whether the remainder re-imports the complete zero set or an RH-equivalent estimate.
  - Reject finite-prefix, termwise-absolute, zero-density-only, and whole-component subexponential variants before source expansion.
  - Query cross-Millennium memory only at operation level under a fresh DifferenceWitness.

