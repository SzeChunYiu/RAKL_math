known_boundary:
  - Coffey's identities give lambda_n = S_Lambda(n) + (n/2) log n + O(n).
  - Lagarias records polynomial Li growth under RH and an exponential-size incomplete-Li alternative when RH fails, including the Riemann-zeta case.
  - Therefore whole-component S_Lambda(n)=exp(o(n)) is root-strength, not a safely weaker supporting lemma.
  - The previous magnitude-only route was already pruned because absolute majorization destroys cancellation.
  - No theorem has been proved for a strictly smaller prime/kernel component.

