nonpromotion_rules:
  - "self-similar exclusion is not Type-I exclusion"
  - "Type-I exclusion is not root regularity while Type-II remains"
  - "boundedness of one scale-invariant quantity is not an unproved implication to another"
  - "a norm-only functional counterexample is not a counterexample to a dynamics-specific Navier–Stokes theorem"
  - "instantaneous pressure-tail summability is not global velocity-tail tightness"
  - "scale-neutral local-energy bookkeeping is not a global anti-replication certificate"
  - "finite kinetic energy is not a scale-independent L3-critical profile count"
  - "a divergence-free packed snapshot is not a Navier–Stokes counterexample"
  - "retrospective analytic calibration is search control only and cannot be renamed preregistered candidate evidence"
  - "failure of one absolute budget route does not blacklist dynamics-specific compactness, coherence, pressure or geometry"
  - "computation is not proof"
  - "same-context review is not independent review"
