          NS-B1a2:
            title: "Finite-energy critical-core quantization"
            result: "Finite kinetic energy costs only O(lambda) per L3-critical core and permits an O(lambda^-1) core-count bound even under favorable pointwise Type-I amplitude."
            failure_memory: "F-NS-B1a2-KINETIC-ENERGY-NONQUANTIZATION"
        next_child:
