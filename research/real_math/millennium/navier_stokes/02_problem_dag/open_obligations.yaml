  NS-B1:
    title: "Type-I blow-up to rigidity-ready ancient class"
    status: TWO_ROUTE_PRUNING_CHILDREN_COMPLETE_THIRD_CHILD_OPENED
    objective: "Assuming a Type-I singularity, identify the exact rescaled ancient class and the smallest inherited property needed for a valid Liouville contradiction."
    source_backed_edges:
      - "Type-I singularity <-> nontrivial mild bounded ancient solution with registered Type-I decay (Albritton–Barker, Theorem 1.1, arXiv:1811.00502)"
      - "mild ancient solution with a backward sequence uniformly bounded in global L3 -> zero (Albritton–Barker, Theorem 1.2, arXiv:1811.00502)"
      - "critical L-infinity_t L3_x control -> regularity / backward-uniqueness route (Escauriaza–Seregin–Šverák 2003)"
      - "exact Leray backward self-similar profiles -> classical Liouville exclusions under source hypotheses (Nečas–Růžička–Šverák 1996; Tsai 1998)"
    route_pruning:
      - id: NS-B1-FUNC-001
        status: CALIBRATION_NEGATIVE_RESULT
        statement: "Finite Albritton–Barker I does not, as a pure functional inequality on arbitrary smooth bounded divergence-free fields, force any globally L3-bounded time slice."
        scope: "Not a Navier–Stokes counterexample; it only blocks norm-definition/interpolation-only proofs of the dynamic bridge."
        evidence: "01_frontier/NS-B1_TYPE_I_IMPLICATION_MATRIX_20260811.md"
      - id: NS-B1a-C001
        status: RETROSPECTIVE_ANALYTIC_SHELL_CALIBRATION
        statement: "Under the time-slice critical Morrey energy bound mu(B(x,r))<=M r, the absolute far-field quadratic pressure contribution decays as O(M R^-2) and the first kernel-gradient contribution as O(M R^-3)."
        authority: "RETROSPECTIVE_ANALYTIC_CALIBRATION / SEARCH_CONTROL_ONLY / NO_NAVIER_STOKES_ROOT_EVIDENCE / ROOT_AUTHORITY_NONE"
        route_consequence: "Use only to deprioritize raw instantaneous pressure-divergence search; pressure-aware temporal/local/coherent routes remain live."
        evidence: "01_frontier/NS-B1a_C001_PRESSURE_TAIL_LOCALIZATION_20260811.md"
      - id: NS-B1a1-C001
        status: SOURCE_BOUND_ROUTE_PRUNING
        statement: "The standard finite-I local-energy ledger is scale-neutral after normalization; finite physical O(R) or O(R^2) costs can remain summable through infinite dyadic descent."
        authority: "SCOPED_ANALYTIC_ROUTE_PRUNING / NO_NAVIER_STOKES_COUNTEREXAMPLE / ROOT_AUTHORITY_NONE"
        route_consequence: "Retire naive shell-budget summation as a scale-termination proof family; require a genuine scale-symmetry breaker."
        evidence: "01_frontier/NS-B1a1_C001_SCALE_CHARGE_AUDIT_20260811.md"
      - id: NS-B1a2-C001
        status: SOURCE_BOUND_ROUTE_PRUNING
        statement: "Even with finite kinetic energy E0 and the favorable extra pointwise Type-I amplitude M/lambda, N disjoint L3-critical cores satisfy only N<=M E0/(gamma^3 lambda); smooth divergence-free packed snapshots attain bounded L2 with N~lambda^-1 and global L3~lambda^-1/3."
        authority: "SCOPED_ANALYTIC_ROUTE_PRUNING / FUNCTIONAL_CALIBRATION / NO_NAVIER_STOKES_COUNTEREXAMPLE / ROOT_AUTHORITY_NONE"
        route_consequence: "Retire finite kinetic energy as a standalone scale-independent critical-core quantization currency; move to dynamics-specific compactness/coherence/no-recrossing."
        evidence: "01_frontier/NS-B1a2_C001_CRITICAL_BLOB_PACKING_AUDIT_20260811.md"
    open_children:
      NS-B1a:
        title: "Dynamics-specific Type-I trace/tail bridge"
        question: "For a mild bounded ancient 3D Navier–Stokes solution with I<infinity, what weakest equation-specific inherited property yields either a backward sequence uniformly bounded in global L3 or another source-valid Liouville trigger?"
        status: TWO_ROUTE_PRUNING_CHILDREN_COMPLETE_THIRD_CHILD_CONTEXT_REQUIRED
        completed_children:
