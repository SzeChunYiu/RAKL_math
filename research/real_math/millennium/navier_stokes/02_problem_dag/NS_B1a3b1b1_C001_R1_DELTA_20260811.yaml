verified_scoped_result:
  statement: >-
    Under the unchanged global vorticity weak-L3/2 and direction log-BMO
    hypotheses used in Grujic v2, if A_lambda is covered by at most N0
    translated balls of radius at most C lambda^-1/2, the localized
    commutator estimate plus the weak-L3/2 finite-union inequality gives
    ||alpha|| on A_lambda = O(N0^(2/3)/log lambda). For fixed N0 this is
    eventually small enough for the nonlinear absorption in equations
    (24)-(25).
