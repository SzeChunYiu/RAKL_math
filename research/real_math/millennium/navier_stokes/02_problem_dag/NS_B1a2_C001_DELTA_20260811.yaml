result: >-
  Precompactness, bounded recurrence, or long-time vector averaging of a
  renormalized orbit does not by itself force a late time with small
  self-similar-time derivative norm. Nonlinear time averaging also leaves a
  fluctuation/Reynolds-stress term.
supported_scope:
  - compactness-only bridge to one-slice generator smallness
  - vector-average cancellation without total-variation control
  - averaged-profile shortcut to stationary Leray equation without fluctuation control
not_supported:
  - finite-I Navier-Stokes orbits are precompact
  - all concentration-compactness routes fail
  - no Lyapunov or finite-variation defect exists
  - Type-I singularities are excluded
linked_open_interface:
  issue: 56
  reason: >-
    Pineau-Vicol Theorem 1.9 additionally requires pointwise Type-I velocity
    control and a fixed-annulus pressure bound; those inheritance questions
    overlap NS-B1b1 and must not be duplicated here.
