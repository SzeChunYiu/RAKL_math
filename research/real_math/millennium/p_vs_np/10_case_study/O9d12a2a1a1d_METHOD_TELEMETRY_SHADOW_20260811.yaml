compatibility_reason: >-
  Current RAKL main includes method-telemetry-v1, but the application remains pinned to an
  older framework and its protected episode-inventory scanner treats any research JSON with a
  top-level episode_id as an inventory candidate. The exact JSON telemetry object was therefore
  removed after CI exposed the incompatibility. This shadow uses the current fields where safe
  without weakening or modifying the protected inventory gate.
