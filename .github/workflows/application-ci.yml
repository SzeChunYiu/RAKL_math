name: Pinned RAKL application tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RAKL_math
        uses: actions/checkout@v4
        with:
          path: application
          # Application-feedback bundles bind source files to a historical
          # producer commit.  A depth-1 checkout cannot re-audit that commit.
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: application/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r application/requirements-test.txt

      - name: Run full application suite against exact framework pin
        run: >-
          python application/tools/run_application_tests.py
          --framework application/framework/RAKL
