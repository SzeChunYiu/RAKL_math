name: Final RAKL mathematical-application overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-rakl-math.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Overlay final pre-split source state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B migration/rakl-final-overlay-20260811 origin/main

          rm -rf /tmp/rakl-source
          git clone --no-single-branch https://github.com/SzeChunYiu/RAKL.git /tmp/rakl-source
          git -C /tmp/rakl-source fetch --all --prune
          source_main_sha="$(git -C /tmp/rakl-source rev-parse origin/main)"

          mkdir -p research/real_math/millennium tests/math_applications migration

          # Non-destructive overlay only: never delete destination-native research.
          if git -C /tmp/rakl-source cat-file -e 'origin/main:research/real_math/millennium' 2>/dev/null; then
            git -C /tmp/rakl-source archive origin/main research/real_math/millennium | tar -x -C "$GITHUB_WORKSPACE"
          fi

          mapfile -t branches < <(git -C /tmp/rakl-source for-each-ref --format='%(refname:short)' refs/remotes/origin/research/ \
            | sed 's#^origin/##' \
            | grep -E '(^research/(pnp|rh-|navier-stokes|yang-mills|hodge|bsd|cross-millennium))' \
            | sort -u)

          for branch in "${branches[@]}"; do
            ref="origin/${branch}"
            case "$branch" in
              research/pnp*) key='p_vs_np' ; pat='p_vs_np|pnp|c0[0-9][0-9]|cover|semifilter|circuit' ;;
              research/rh-*) key='riemann' ; pat='riemann|rh_' ;;
              research/navier-stokes*) key='navier' ; pat='navier|stokes|ns_' ;;
              research/yang-mills*) key='yang' ; pat='yang|mills|ym_' ;;
              research/hodge*) key='hodge' ; pat='hodge' ;;
              research/bsd*) key='bsd|birch' ; pat='bsd|birch|selmer' ;;
              research/cross-millennium*) key='cross' ; pat='cross_millennium|millennium_cross' ;;
              *) continue ;;
            esac

            if git -C /tmp/rakl-source cat-file -e "$ref:research/real_math/millennium" 2>/dev/null; then
              while IFS= read -r dir; do
                [ -n "$dir" ] || continue
                if echo "$dir" | grep -Eqi "$key"; then
                  git -C /tmp/rakl-source archive "$ref" "research/real_math/millennium/$dir" | tar -x -C "$GITHUB_WORKSPACE"
                fi
              done < <(git -C /tmp/rakl-source ls-tree -d --name-only "$ref:research/real_math/millennium")
            fi

            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if echo "$f" | grep -Eqi "$pat"; then
                out="tests/math_applications/${f#tests/}"
                mkdir -p "$(dirname "$out")"
                git -C /tmp/rakl-source show "$ref:$f" > "$out"
              fi
            done < <(git -C /tmp/rakl-source ls-tree -r --name-only "$ref" tests 2>/dev/null || true)
          done

          {
            echo '# Final pre-split source overlay provenance'
            echo
            echo "Source RAKL main: \`$source_main_sha\`."
            echo
            echo 'Source mathematical research branch heads overlaid:'
            for branch in "${branches[@]}"; do
              sha="$(git -C /tmp/rakl-source rev-parse "origin/$branch")"
              echo "- \`$branch\` @ \`$sha\`"
            done
            echo
            echo 'This overlay is additive/non-destructive. Source branches remain in RAKL as historical provenance. Future mathematical application work belongs only in RAKL_math.'
          } > migration/RAKL_FINAL_SOURCE_OVERLAY_PROVENANCE.md

          git status --short

      - name: Commit overlay to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/real_math/millennium tests/math_applications migration/RAKL_FINAL_SOURCE_OVERLAY_PROVENANCE.md
          if git diff --cached --quiet; then
            echo 'No final source delta.'
            exit 0
          fi
          git commit -m '[migration] overlay final pre-split RAKL math state'
          git push --force-with-lease origin HEAD:refs/heads/migration/rakl-final-overlay-20260811
