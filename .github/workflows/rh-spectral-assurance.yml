name: RH spectral assurance

on:
  pull_request:
    paths:
      - 'research/real_math/millennium/riemann_hypothesis/**'
      - 'tests/math_applications/test_rh_spec_*.py'
      - '.github/workflows/rh-spectral-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mathematical application head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Bind checkout to exact application subject
        shell: bash
        env:
          EXPECTED_APPLICATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_APPLICATION_SHA"
          test "$(git rev-parse HEAD:framework/RAKL)" = "$(git -C framework/RAKL rev-parse HEAD)"
          echo "RAKL_MATH_SUBJECT_SHA=$EXPECTED_APPLICATION_SHA" >> "$GITHUB_ENV"
          echo "application_head=$EXPECTED_APPLICATION_SHA"
          echo "framework_head=$(git -C framework/RAKL rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run RH spectral strict assurance regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONNOUSERSITE=1 \
          PYTHONINTMAXSTRDIGITS=0 \
          python tools/run_application_tests.py --framework framework/RAKL -- \
            tests/math_applications/test_rh_spec_001_strict_packet.py \
            tests/math_applications/test_rh_spec_001_bridge_matrix.py \
            tests/math_applications/test_rh_spec_002_strict_packet.py \
            tests/math_applications/test_rh_spec_002_limit_calibration.py
