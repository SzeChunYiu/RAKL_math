name: RH spectral assurance

on:
  pull_request:
    paths:
      - 'research/real_math/millennium/riemann_hypothesis/**'
      - 'tests/math_applications/test_rh_spec_*.py'
      - '.github/workflows/rh-spectral-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mathematical application head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Show exact assurance subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:framework/RAKL)" = "$(git -C framework/RAKL rev-parse HEAD)"
          echo "application_head=$(git rev-parse HEAD)"
          echo "framework_head=$(git -C framework/RAKL rev-parse HEAD)"

      - name: Run RH spectral strict assurance regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONNOUSERSITE=1 \
          PYTHONINTMAXSTRDIGITS=0 \
          python tools/run_application_tests.py --framework framework/RAKL -- \
            tests/math_applications/test_rh_spec_001_strict_packet.py \
            tests/math_applications/test_rh_spec_001_bridge_matrix.py \
            tests/math_applications/test_rh_spec_002_strict_packet.py \
            tests/math_applications/test_rh_spec_002_limit_calibration.py
